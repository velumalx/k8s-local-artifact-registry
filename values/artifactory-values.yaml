# values/artifactory-values.yaml
#
# Overrides for the jfrog/artifactory-oss chart, tuned for a single-node
# Docker Desktop Kubernetes cluster. See:
# docs/superpowers/specs/2026-07-24-jfrog-artifactory-oss-k8s-design.md
artifactory:
  # This chart/app version (artifactory-oss v107.146.29 / appVersion
  # 7.146.29) hard-rejects the embedded Derby database at startup
  # (org.jfrog.storage.dbtype.DbTypeNotAllowedException: DB Type derby is
  # not allowed) and requires PostgreSQL. We use the chart's bundled
  # Postgres subchart so the deployment stays fully self-contained on
  # Docker Desktop.
  postgresql:
    enabled: true
    primary:
      persistence:
        size: 5Gi

  # We front Artifactory with our own ingress-nginx release (see
  # scripts/install-ingress.sh) instead of the chart's bundled nginx +
  # LoadBalancer service.
  nginx:
    enabled: false

  ingress:
    enabled: true
    hosts:
      - artifactory.local
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"

  artifactory:
    replicaCount: 1
    persistence:
      size: 5Gi
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1"
